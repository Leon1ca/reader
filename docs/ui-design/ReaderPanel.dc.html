<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阅读器 · 阅读面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #F3ECDF; background-image: radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0.28), rgba(255,255,255,0) 60%), radial-gradient(140% 120% at 50% 50%, rgba(0,0,0,0) 60%, rgba(90,70,40,0.06)); font-family: 'Noto Sans SC', sans-serif; color: #2B2620">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 76px; padding: 26px 64px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <span style="font-size: 13px; font-weight: 400; letter-spacing: 1px; color: #5A5040">本章剩余 4 页</span>
  </div>
  <a href="Main.dc.html" aria-label="关闭本书" style="position: absolute; top: 29px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
    <span style="width: 30px; height: 30px; border-radius: 15px; background: rgba(90,80,64,0.1); display: flex; align-items: center; justify-content: center; color: #4A4236"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l8 8M10 2L2 10"></path></svg></span>
  </a>

  <div style="position: absolute; top: 76px; left: 26px; right: 26px; font-family: 'Noto Serif SC', serif">
    <p style="margin: 0 0 10px; text-indent: 2em; font-size: 18px; line-height: 1.75; text-align: justify">我冒了严寒，回到相隔二千余里，别了二十余年的故乡去。</p>
    <p style="margin: 0 0 10px; text-indent: 2em; font-size: 18px; line-height: 1.75; text-align: justify">时候既然是深冬；渐近故乡时，天气又阴晦了，冷风吹进船舱中，呜呜的响，从篷隙向外一望，苍黄的天底下，远近横着几个萧索的荒村，没有一些活气。我的心禁不住悲凉起来了。</p>
    <p style="margin: 0 0 10px; text-indent: 2em; font-size: 18px; line-height: 1.75; text-align: justify">阿！这不是我二十年来时时记得的故乡？</p>
  </div>

  <section aria-label="阅读设置" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 30px; border-radius: 24px 24px 0 0; background: #FBF8F2; box-shadow: 0 -8px 30px rgba(43,38,32,0.12); display: flex; flex-direction: column; gap: 14px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #DDD4C4; align-self: center; margin-bottom: 4px"></div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">亮度</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 0 12px; border-radius: 12px; background: #F0EADF; display: flex; align-items: center; gap: 12px; color: #6B604F">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2"></path></svg>
        <div style="flex: 1; height: 4px; border-radius: 2px; background: #E2D9C8; position: relative"><div style="width: 62%; height: 100%; border-radius: 2px; background: #1F5FCC"></div><div style="position: absolute; left: 62%; top: 50%; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: #FFFFFF; box-shadow: 0 1px 4px rgba(43,38,32,0.25)"></div></div>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"></path></svg>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">背景</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 3px">
        <button type="button" aria-label="白色" style="border: none; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 11px; background: #FFFFFF; box-shadow: inset 0 0 0 0.5px rgba(43,38,32,0.25)"></span></button>
        <button type="button" aria-label="米黄（当前）" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 11px; background: #F3ECDF; box-shadow: inset 0 0 0 1.5px #1F5FCC"></span></button>
        <button type="button" aria-label="豆绿" style="border: none; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 11px; background: #DCE8D6; box-shadow: inset 0 0 0 0.5px rgba(43,38,32,0.2)"></span></button>
        <button type="button" aria-label="浅灰" style="border: none; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 11px; background: #E6E6E3; box-shadow: inset 0 0 0 0.5px rgba(43,38,32,0.2)"></span></button>
        <button type="button" aria-label="深色" style="border: none; border-radius: 9px; background: transparent; display: flex; align-items: center; justify-content: center"><span style="width: 22px; height: 22px; border-radius: 11px; background: #1E1D1B"></span></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">翻页</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
        <button type="button" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); font: inherit; font-size: 13px; font-weight: 500; color: #1F5FCC">左右分页</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 400; color: #3B342A">上下滚动</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">夜间</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
        <button type="button" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); font: inherit; font-size: 13px; font-weight: 500; color: #1F5FCC">跟随系统</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 400; color: #3B342A">关闭</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 400; color: #3B342A">开启</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 300; color: #6B604F; padding-top: 2px">
      <span>背景与翻页对所有图书生效</span>
      <a href="ReaderSettings.dc.html" style="font-size: 12px; color: #1F5FCC; font-weight: 400; text-decoration: none; height: 32px; display: flex; align-items: center">字体排版 ›</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
