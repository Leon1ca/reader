<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>导入进度与结果</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">
  <div style="position: absolute; inset: 0; background: rgba(20,22,26,0.28)"></div>

  <section aria-label="导入图书" style="position: absolute; left: 0; right: 0; top: 96px; bottom: 0; border-radius: 24px 24px 0 0; background: #F7F7F5; display: flex; flex-direction: column">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #D6D6D1; align-self: center; margin-top: 10px"></div>
    <div style="padding: 14px 20px 0; display: flex; flex-direction: column; gap: 4px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 500">正在导入 7 个文件</h2>
      <span style="font-size: 12px; font-weight: 300; color: #63666C">已处理 6 / 7 · 3 成功 · 1 重复 · 2 失败</span>
    </div>
    <div style="margin: 12px 20px 0; height: 3px; border-radius: 2px; background: #E4E4E0; overflow: hidden"><div style="width: 86%; height: 100%; background: #1F5FCC"></div></div>

    <ul style="list-style: none; margin: 14px 20px 0; padding: 0 16px; border-radius: 16px; background: #FFFFFF">
      <sc-for list="{{items}}" as="f" hint-placeholder-count="7">
        <li style="min-height: 56px; display: flex; align-items: center; gap: 12px; {{f.border}}">
          <span style="width: 36px; height: 36px; border-radius: 8px; font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; flex: none; {{f.badge}}">{{f.fmt}}</span>
          <div style="flex: 1; min-width: 0"><div style="font-size: 14px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{f.name}}</div><div style="font-size: 12px; font-weight: 400; {{f.noteColor}}">{{f.note}}</div></div>
          <sc-if value="{{f.ok}}" hint-placeholder-val="{{false}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="成功"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.3 4.6-4.8"></path></svg></sc-if>
          <sc-if value="{{f.busy}}" hint-placeholder-val="{{false}}"><span aria-label="处理中" style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #D6DCEA; border-top-color: #1F5FCC; box-sizing: border-box"></span></sc-if>
          <sc-if value="{{f.dup}}" hint-placeholder-val="{{false}}"><a href="BookDetail.dc.html" style="height: 30px; padding: 0 12px; border-radius: 15px; border: 0.5px solid #D9D9D4; font-size: 12px; font-weight: 400; color: #1F5FCC; text-decoration: none; display: flex; align-items: center">查看</a></sc-if>
        </li>
      </sc-for>
    </ul>

    <div style="margin-top: auto; padding: 14px 20px 30px; display: flex; flex-direction: column; gap: 8px">
      <a href="Main.dc.html" style="height: 48px; border-radius: 24px; background: #1F5FCC; color: #FFFFFF; font-size: 15px; font-weight: 400; text-decoration: none; display: flex; align-items: center; justify-content: center">在后台继续</a>
      <button type="button" style="height: 44px; border: none; background: transparent; color: #1F5FCC; font: inherit; font-size: 14px; font-weight: 400">重新选择失败的文件</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const ok = 'color: #1E6B45;', warn = 'color: #8A4600;', info = 'color: #1F5FCC;', mute = 'color: #63666C;';
    const blue = 'background: #E9F0FC; color: #1F5FCC;', grey = 'background: #F0F0EC; color: #63666C;';
    const raw = [
      ['人间词话.epub', 'EPUB', '已加入书架', ok, blue, 'ok'],
      ['西游记.txt', 'TXT', '已加入书架 · 编码 GB18030 · 100 回', ok, blue, 'ok'],
      ['漫画合集 第二卷.cbz', 'CBZ', '已加入书架 · 192 页', ok, blue, 'ok'],
      ['傲慢与偏见（副本）.mobi', 'MOBI', '已在书架中，保留原进度和书签', mute, blue, 'dup'],
      ['庄子.epub', 'EPUB', '解析目录中 · 62%', info, blue, 'busy'],
      ['年度报告.pdf', 'PDF', '文件受保护或需要密码，当前版本不支持', warn, grey, 'fail'],
      ['资料合集.zip', 'ZIP', '文件无法解析，可重新选择文件', warn, grey, 'fail']
    ];
    const items = raw.map((r, i) => ({
      name: r[0], fmt: r[1], note: r[2], noteColor: r[3], badge: r[4],
      ok: r[5] === 'ok', dup: r[5] === 'dup', busy: r[5] === 'busy',
      border: i < raw.length - 1 ? 'border-bottom: 0.5px solid #ECECE8;' : ''
    }));
    return { items };
  }
}
</script>
</body>
</html>
