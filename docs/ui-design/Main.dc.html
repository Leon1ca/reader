<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>书架</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">

  <header style="padding: 30px 16px 0 20px; display: flex; align-items: center; justify-content: space-between">
    <h1 style="margin: 0; font-size: 26px; font-weight: 500; letter-spacing: 1px">书架</h1>
    <sc-if value="{{hasBooks}}" hint-placeholder-val="{{true}}">
      <div style="display: flex; gap: 8px">
        <a href="ShelfSelect.dc.html" aria-label="选择" style="width: 36px; height: 36px; background: rgba(20,22,26,0.05); border-radius: 18px; color: #2A2C30; display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.25"></circle><path d="M8.4 12.2l2.5 2.4 4.7-5"></path></svg></a>
        <button type="button" aria-label="更多" style="width: 36px; height: 36px; border: none; background: rgba(20,22,26,0.05); border-radius: 18px; color: #2A2C30; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.75" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18.25" cy="12" r="1.5"></circle></svg></button>
      </div>
    </sc-if>
  </header>

  <sc-if value="{{hasBooks}}" hint-placeholder-val="{{true}}">
    <div style="padding: 10px 20px 0">
      <label style="display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px; border-radius: 12px; background: rgba(20,22,26,0.05); color: #63666C; font-size: 14px; font-weight: 300">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="10.75" cy="10.75" r="6.25"></circle><path d="M15.4 15.4l4.6 4.6"></path></svg>
        <input type="search" placeholder="搜索书名、作者" aria-label="搜索书名、作者" style="flex: 1; border: none; background: transparent; font: inherit; color: #1A1B1E; outline: none; min-width: 0">
      </label>
    </div>

    <sc-if value="{{showRecent}}" hint-placeholder-val="{{true}}">
      <div style="padding: 16px 20px 0; display: flex; align-items: center; justify-content: space-between">
        <a href="ContinueList.dc.html" aria-label="查看全部继续阅读" style="height: 36px; display: flex; align-items: center; gap: 1px; text-decoration: none; color: #1A1B1E">
          <h2 style="margin: 0; font-size: 17px; font-weight: 500; letter-spacing: 0.5px">继续阅读</h2>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A8D93" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 6l6 6-6 6"></path></svg>
        </a>
        <span style="font-size: 12px; font-weight: 300; color: #63666C">{{recentCount}}</span>
      </div>
      <div aria-label="继续阅读，可左右滑动" style="margin-top: 10px; display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scroll-padding: 0 20px; padding: 2px 20px 12px; scrollbar-width: none">
        <sc-for list="{{recentList}}" as="r" hint-placeholder-count="3">
          <a href="Reader.dc.html" style="flex: 0 0 272px; scroll-snap-align: start; box-sizing: border-box; padding: 14px; border-radius: 18px; background: #FFFFFF; box-shadow: 0 0 0 0.5px rgba(20,22,26,0.05), 0 1px 2px rgba(20,22,26,0.04), 0 8px 24px -10px rgba(20,22,26,0.16); display: flex; gap: 14px; text-decoration: none; color: #1A1B1E">
            <div style="width: 78px; height: 104px; flex: none; border-radius: 3px 5px 5px 3px; background-color: {{r.bg}}; background-image: linear-gradient(90deg, rgba(0,0,0,0.22) 0, rgba(0,0,0,0.08) 2px, rgba(255,255,255,0.16) 3px, rgba(255,255,255,0) 7px), linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0) 40%, rgba(0,0,0,0.08)); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 10px 16px -8px rgba(30,25,20,0.4); display: flex; justify-content: center; padding-top: 12px; box-sizing: border-box">
              <div style="writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-size: 13px; font-weight: 500; letter-spacing: 3px; color: {{r.fg}}; max-height: 80px; overflow: hidden">{{r.cover}}</div>
            </div>
            <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
              <div style="font-size: 11px; font-weight: 300; color: #63666C; letter-spacing: 0.3px">{{r.when}}</div>
              <div style="margin-top: 4px; font-family: 'Noto Serif SC', serif; font-size: 15px; font-weight: 500; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden">{{r.title}}</div>
              <div style="margin-top: 2px; font-size: 12px; font-weight: 300; color: #63666C">{{r.author}}</div>
              <div style="margin-top: auto; display: flex; align-items: center; gap: 8px">
                <div style="flex: 1; height: 3px; border-radius: 2px; background: #EDEDE9; overflow: hidden"><div style="width: {{r.pct}}; height: 100%; background: #1F5FCC"></div></div>
                <span style="font-size: 11px; color: #63666C; font-variant-numeric: tabular-nums">{{r.pct}}</span>
              </div>
            </div>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <div style="margin-top: 10px; padding: 0 20px; display: flex; gap: 8px; overflow: hidden; white-space: nowrap">
      <button type="button" style="height: 30px; padding: 0 14px; border-radius: 15px; border: none; background: #24262A; color: #FFFFFF; font: inherit; font-size: 13px; font-weight: 400">全部 18</button>
      <button type="button" style="height: 30px; padding: 0 14px; border-radius: 15px; border: 0.5px solid #D9D9D4; background: #FFFFFF; color: #44474D; font: inherit; font-size: 13px; font-weight: 300">小说</button>
      <button type="button" style="height: 30px; padding: 0 14px; border-radius: 15px; border: 0.5px solid #D9D9D4; background: #FFFFFF; color: #44474D; font: inherit; font-size: 13px; font-weight: 300">古典</button>
      <button type="button" style="height: 30px; padding: 0 14px; border-radius: 15px; border: 0.5px solid #D9D9D4; background: #FFFFFF; color: #44474D; font: inherit; font-size: 13px; font-weight: 300">漫画</button>
      <button type="button" style="height: 30px; padding: 0 14px; border-radius: 15px; border: 0.5px solid #D9D9D4; background: #FFFFFF; color: #44474D; font: inherit; font-size: 13px; font-weight: 300">未分类</button>
    </div>

    <div style="padding: 12px 20px 0; display: flex; align-items: center; gap: 2px; font-size: 13px">
      <span style="color: #63666C; font-weight: 300; margin-right: 6px">排序</span>
      <button type="button" style="height: 32px; padding: 0 8px; border: none; background: transparent; font: inherit; color: #1A1B1E; font-weight: 500">最近阅读</button>
      <span style="color: #C9CAC5">·</span>
      <button type="button" style="height: 32px; padding: 0 8px; border: none; background: transparent; font: inherit; color: #63666C; font-weight: 300">书名</button>
      <span style="color: #C9CAC5">·</span>
      <button type="button" style="height: 32px; padding: 0 8px; border: none; background: transparent; font: inherit; color: #63666C; font-weight: 300">作者</button>
    </div>

    <div style="padding: 8px 20px 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); column-gap: 18px; row-gap: 20px">
      <sc-for list="{{books}}" as="b" hint-placeholder-count="9">
        <a href="BookDetail.dc.html" style="display: flex; flex-direction: column; gap: 7px; min-width: 0; text-decoration: none">
          <div style="aspect-ratio: 3 / 4; border-radius: 2px 5px 5px 2px; background-color: {{b.bg}}; background-image: linear-gradient(90deg, rgba(0,0,0,0.22) 0, rgba(0,0,0,0.08) 2px, rgba(255,255,255,0.16) 3px, rgba(255,255,255,0) 7px, rgba(0,0,0,0.05) 9px, rgba(0,0,0,0) 14px), linear-gradient(160deg, rgba(255,255,255,0.12), rgba(255,255,255,0) 40%, rgba(0,0,0,0.08)); box-shadow: 0 0 0 0.5px rgba(0,0,0,0.08), 0 1px 1px rgba(30,25,20,0.08), 0 10px 18px -8px rgba(30,25,20,0.38); position: relative; overflow: hidden">
            <sc-if value="{{b.vertical}}" hint-placeholder-val="{{true}}">
              <div aria-hidden="true" style="position: absolute; inset: 6px 6px 6px 10px; border: 0.5px solid {{b.fg}}; opacity: 0.32; border-radius: 1px"></div>
              <div style="position: absolute; top: 14px; left: 0; right: 0; display: flex; justify-content: center"><div style="writing-mode: vertical-rl; font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 15px; letter-spacing: 4px; color: {{b.fg}}">{{b.title}}</div></div>
            </sc-if>
            <sc-if value="{{b.horizontal}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; top: 14px; left: 11px; right: 11px; display: flex; flex-direction: column; gap: 8px">
                <div style="font-family: 'Noto Serif SC', serif; font-weight: 500; font-size: 13px; line-height: 1.4; color: {{b.fg}}">{{b.title}}</div>
                <div style="width: 18px; height: 1px; background: {{b.fg}}; opacity: 0.5"></div>
                <div style="font-size: 9.5px; font-weight: 300; color: {{b.fg}}; opacity: 0.85">{{b.author}}</div>
              </div>
            </sc-if>
            <span style="position: absolute; right: 6px; bottom: 6px; font-size: 10px; font-weight: 500; letter-spacing: 0.6px; padding: 2px 5px; border-radius: 3px; {{b.badge}}">{{b.fmt}}</span>
            <sc-if value="{{b.importing}}" hint-placeholder-val="{{false}}">
              <div style="position: absolute; inset: 0; background: rgba(247,247,245,0.78); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px">
                <div style="width: 38px; height: 38px; border-radius: 50%; background: conic-gradient(#1F5FCC 0 62%, #D9DBE0 62% 100%); display: flex; align-items: center; justify-content: center"><div style="width: 32px; height: 32px; border-radius: 50%; background: #F7F7F5; font-size: 10px; font-weight: 500; display: flex; align-items: center; justify-content: center; color: #1A1B1E">62%</div></div>
                <span style="font-size: 11px; color: #44474D; font-weight: 400">正在导入</span>
              </div>
            </sc-if>
          </div>
          <div title="{{b.title}}" style="font-size: 13px; font-weight: 400; color: #1A1B1E; white-space: nowrap; letter-spacing: 0.3px">{{b.short}}</div>
          <div style="font-size: 11px; font-weight: 300; color: #63666C; margin-top: -3px">{{b.meta}}</div>
        </a>
      </sc-for>
    </div>
  </sc-if>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{false}}">
    <div style="position: absolute; left: 32px; right: 32px; top: 200px; display: flex; flex-direction: column; align-items: center; text-align: center">
      <svg width="112" height="88" viewBox="0 0 112 88" fill="none" stroke="#B8B3A7" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><rect x="22" y="14" width="16" height="62" rx="2.5"></rect><rect x="42" y="22" width="16" height="54" rx="2.5"></rect><rect x="64" y="18" width="16" height="58" rx="2.5" transform="rotate(-12 72 47)"></rect><path d="M12 77.5h88" stroke-linecap="round"></path><path d="M26 26h8M46 34h8" stroke-linecap="round"></path></svg>
      <h2 style="margin: 24px 0 0; font-size: 17px; font-weight: 500; letter-spacing: 0.5px">书架还是空的</h2>
      <p style="margin: 8px 0 0; font-size: 13px; font-weight: 300; line-height: 1.7; color: #63666C">支持 EPUB、MOBI、TXT、PDF 和 CBZ 漫画。导入时会复制一份到应用内，原文件不会被改动。</p>
      <a href="ImportProgress.dc.html" style="margin-top: 24px; height: 44px; padding: 0 28px; border-radius: 22px; background: #1F5FCC; color: #FFFFFF; font-size: 15px; font-weight: 400; letter-spacing: 0.5px; text-decoration: none; display: flex; align-items: center">导入图书</a>
      <button type="button" style="margin-top: 8px; height: 40px; padding: 0 16px; border: none; background: transparent; color: #1F5FCC; font: inherit; font-size: 14px; font-weight: 400">选择漫画图片文件夹</button>
    </div>
  </sc-if>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 140px; background: linear-gradient(to bottom, rgba(247,247,245,0), rgba(247,247,245,0.96) 55%)"></div>
  <div style="position: absolute; left: 0; bottom: 0">
    <dc-import name="TabBar" active="shelf" hint-size="390px,112px"></dc-import>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"recent":{"editor":"enum","options":["7","2","1","0"],"default":"7"},"empty":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const empty = this.props.empty === true || this.props.empty === 'true';
    const n = Math.max(0, Math.min(7, Number(this.props.recent ?? 7)));
    const raw = [
      { title: '呐喊', author: '鲁迅', fmt: 'EPUB', meta: '已读 23%', bg: '#3E5C4E', fg: '#F2EAD8', v: true },
      { title: '红楼梦', author: '曹雪芹', fmt: 'EPUB', meta: '已读 61%', bg: '#8C2F2B', fg: '#F6E6CF', v: true },
      { title: '一个陌生女人的来信', author: '茨威格', fmt: 'EPUB', meta: '已读 34%', bg: '#3F4A5C', fg: '#ECE7DD' },
      { title: '彷徨', author: '鲁迅', fmt: 'EPUB', meta: '已读 47%', bg: '#5C4A3A', fg: '#F0E4D2', v: true },
      { title: '浮生六记', author: '沈复', fmt: 'MOBI', meta: '已读 22%', bg: '#7A3E3A', fg: '#F6E3DA', v: true },
      { title: '营造法式', author: '李诫 · 扫描本', fmt: 'PDF', meta: '42 / 318 页', bg: '#5B5148', fg: '#F0E6D7' },
      { title: '漫画合集 第一卷', author: '[作者]', fmt: 'CBZ', meta: '12 / 186 页', bg: '#E7A93A', fg: '#2A2015', light: true },
      { title: '庄子', author: '庄周', fmt: 'EPUB', meta: '解析目录中', bg: '#262626', fg: '#B5B5B5', v: true, importing: true },
      { title: '傲慢与偏见', author: '简·奥斯汀', fmt: 'MOBI', meta: '未开始', bg: '#2E4A6B', fg: '#EEF2F7' },
      { title: '唐诗三百首', author: '蘅塘退士', fmt: 'EPUB', meta: '已读完', bg: '#6B7F5A', fg: '#F1F0E4', v: true },
      { title: '瓦尔登湖', author: '梭罗', fmt: 'TXT', meta: '未开始', bg: '#D9CBA5', fg: '#2E2A1E', light: true },
      { title: '罗密欧与朱丽叶', author: '莎士比亚', fmt: 'MOBI', meta: '未开始', bg: '#B4583A', fg: '#FBEDE4' }
    ];
    const books = raw.map((b) => {
      const chars = Array.from(b.title);
      return {
        ...b,
        short: chars.length > 8 ? chars.slice(0, 7).join('') + '…' : b.title,
        vertical: !!b.v,
        horizontal: !b.v,
        importing: !!b.importing,
        badge: b.light ? 'background: rgba(26,27,30,0.82); color: #FFFFFF;' : 'background: rgba(255,255,255,0.92); color: #1A1B1E;'
      };
    });
    const recent = [
      { cover: '呐喊', title: '呐喊', author: '鲁迅', when: '2 小时前', pct: '23%', bg: '#3E5C4E', fg: '#F2EAD8' },
      { cover: '红楼梦', title: '红楼梦', author: '曹雪芹', when: '昨天', pct: '61%', bg: '#8C2F2B', fg: '#F6E6CF' },
      { cover: '来信', title: '一个陌生女人的来信', author: '茨威格', when: '3 天前', pct: '34%', bg: '#3F4A5C', fg: '#ECE7DD' },
      { cover: '彷徨', title: '彷徨', author: '鲁迅', when: '上周', pct: '47%', bg: '#5C4A3A', fg: '#F0E4D2' },
      { cover: '浮生六记', title: '浮生六记', author: '沈复', when: '9 月 20 日', pct: '22%', bg: '#7A3E3A', fg: '#F6E3DA' },
      { cover: '营造法式', title: '营造法式', author: '李诫', when: '9 月 18 日', pct: '13%', bg: '#5B5148', fg: '#F0E6D7' },
      { cover: '漫画合集', title: '漫画合集 第一卷', author: '[作者]', when: '9 月 12 日', pct: '6%', bg: '#E7A93A', fg: '#2A2015' }
    ];
    return {
      books,
      recentList: recent.slice(0, n),
      recentCount: n > 1 ? n + ' 本' : '',
      hasBooks: !empty,
      isEmpty: empty,
      showRecent: !empty && n > 0
    };
  }
}
</script>
</body>
</html>
