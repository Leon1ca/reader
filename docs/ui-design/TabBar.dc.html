<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>浮动胶囊导航栏</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: {{w}}px; height: 112px; position: relative; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">
  <div style="position: absolute; left: 16px; right: 16px; bottom: 22px; display: flex; gap: 10px; align-items: center">
    <nav aria-label="主导航" style="flex: 1; height: 62px; box-sizing: border-box; padding: 4px; border-radius: 31px; background: rgba(255,255,255,0.84); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); border: 0.5px solid rgba(20,22,26,0.08); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.8), 0 0 0 0.5px rgba(20,22,26,0.06), 0 14px 32px -12px rgba(20,22,26,0.28); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 2px">

      <a href="Main.dc.html" aria-label="书架" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; text-decoration: none; font-size: 10px; letter-spacing: 0.4px; {{s.shelf}}">
        <sc-if value="{{on.shelf}}" hint-placeholder-val="{{true}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><rect x="3.5" y="4.5" width="5" height="15" rx="1.4"></rect><rect x="9.5" y="4.5" width="5" height="15" rx="1.4"></rect><rect x="15.4" y="5" width="5" height="15" rx="1.4" transform="rotate(-14 17.9 12.5)"></rect></svg>
        </sc-if>
        <sc-if value="{{off.shelf}}" hint-placeholder-val="{{false}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="3.75" y="4.75" width="4.5" height="14.5" rx="1.2"></rect><rect x="9.75" y="4.75" width="4.5" height="14.5" rx="1.2"></rect><rect x="15.65" y="5.25" width="4.5" height="14.5" rx="1.2" transform="rotate(-14 17.9 12.5)"></rect></svg>
        </sc-if>
        <span>书架</span>
      </a>

      <a href="Later.dc.html" aria-label="稍后阅读" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; text-decoration: none; font-size: 10px; letter-spacing: 0.4px; {{s.later}}">
        <sc-if value="{{on.later}}" hint-placeholder-val="{{false}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="14.5" r="3.6" fill="currentColor"></circle><circle cx="17.5" cy="14.5" r="3.6" fill="currentColor"></circle><path d="M10.1 13.6c1.2-.9 2.6-.9 3.8 0"></path><path d="M2.9 14.2l1.7-6.3a1.9 1.9 0 0 1 1.8-1.4h.9"></path><path d="M21.1 14.2l-1.7-6.3a1.9 1.9 0 0 0-1.8-1.4h-.9"></path></svg>
        </sc-if>
        <sc-if value="{{off.later}}" hint-placeholder-val="{{true}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6.5" cy="14.5" r="3.4"></circle><circle cx="17.5" cy="14.5" r="3.4"></circle><path d="M9.9 13.6c1.3-.9 2.9-.9 4.2 0"></path><path d="M3.1 14.2l1.5-6.3a1.9 1.9 0 0 1 1.8-1.4h.9"></path><path d="M20.9 14.2l-1.5-6.3a1.9 1.9 0 0 0-1.8-1.4h-.9"></path></svg>
        </sc-if>
        <span>稍后阅读</span>
      </a>

      <a href="Rss.dc.html" aria-label="RSS" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; text-decoration: none; font-size: 10px; letter-spacing: 0.4px; {{s.rss}}">
        <sc-if value="{{on.rss}}" hint-placeholder-val="{{false}}">
          <svg width="24" height="24" viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="4.5" fill="currentColor"></rect><circle cx="8.6" cy="15.4" r="1.4" fill="#FFFFFF"></circle><path d="M7.6 11.1a5.3 5.3 0 0 1 5.3 5.3M7.6 7.4a9 9 0 0 1 9 9" fill="none" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round"></path></svg>
        </sc-if>
        <sc-if value="{{off.rss}}" hint-placeholder-val="{{true}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3.75" y="3.75" width="16.5" height="16.5" rx="4.4"></rect><circle cx="8.6" cy="15.4" r="1.1" fill="currentColor" stroke="none"></circle><path d="M7.6 11.1a5.3 5.3 0 0 1 5.3 5.3M7.6 7.4a9 9 0 0 1 9 9"></path></svg>
        </sc-if>
        <span>RSS</span>
      </a>

      <a href="Settings.dc.html" aria-label="设置" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: 27px; text-decoration: none; font-size: 10px; letter-spacing: 0.4px; {{s.settings}}">
        <sc-if value="{{on.settings}}" hint-placeholder-val="{{false}}">
          <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.1" fill="none" stroke="currentColor" stroke-width="2.6" stroke-dasharray="3.18 3.18"></circle><circle cx="12" cy="12" r="6.9" fill="currentColor"></circle><circle cx="12" cy="12" r="2.5" fill="#E9F0FC"></circle></svg>
        </sc-if>
        <sc-if value="{{off.settings}}" hint-placeholder-val="{{true}}">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="8.1" stroke-width="2.4" stroke-dasharray="3.18 3.18"></circle><circle cx="12" cy="12" r="6.4" stroke-width="1.5"></circle><circle cx="12" cy="12" r="2.4" stroke-width="1.5"></circle></svg>
        </sc-if>
        <span>设置</span>
      </a>
    </nav>
    <sc-if value="{{showOrb}}" hint-placeholder-val="{{true}}">
      <a href="{{orbHref}}" aria-label="{{orbLabel}}" style="width: 62px; height: 62px; flex: none; border-radius: 50%; border: 0.5px solid rgba(20,22,26,0.08); background: rgba(255,255,255,0.84); backdrop-filter: blur(24px) saturate(1.6); -webkit-backdrop-filter: blur(24px) saturate(1.6); box-shadow: inset 0 0.5px 0 rgba(255,255,255,0.8), 0 0 0 0.5px rgba(20,22,26,0.06), 0 14px 32px -12px rgba(20,22,26,0.28); display: flex; align-items: center; justify-content: center; color: #1F5FCC; text-decoration: none">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 4.5v15M4.5 12h15"></path></svg>
      </a>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["shelf","later","rss","settings"],"default":"shelf"},"w":{"editor":"int","min":320,"max":640,"default":390},"$preview":{"width":390,"height":112}}'>
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'shelf';
    const onS = 'background: linear-gradient(180deg, #EDF3FD, #E3ECFB); box-shadow: inset 0 0 0 0.5px rgba(31,95,204,0.10); color: #1F5FCC; font-weight: 500;';
    const offS = 'background: transparent; color: #44474D; font-weight: 400;';
    const keys = ['shelf', 'later', 'rss', 'settings'];
    const s = {}, on = {}, off = {};
    keys.forEach((k) => { s[k] = a === k ? onS : offS; on[k] = a === k; off[k] = a !== k; });
    const labels = { shelf: '导入图书', later: '粘贴链接', rss: '添加订阅' };
    const hrefs = { shelf: 'ImportProgress.dc.html', later: 'AddLink.dc.html', rss: 'RssAdd.dc.html' };
    return { w: Number(this.props.w ?? 390), s, on, off, showOrb: a !== 'settings', orbLabel: labels[a] || '', orbHref: hrefs[a] || '#' };
  }
}
</script>
</body>
</html>
