<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>保存任务 · 进行中</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;family=Noto+Serif+SC:wght@400;500&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">

  <div style="height: 84px; padding: 28px 8px 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px">
    <a href="Later.dc.html" aria-label="返回稍后阅读" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1B1E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 500">保存详情</span>
  </div>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 12px">
    <div style="padding: 16px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Noto Serif SC', serif; font-size: 17px; font-weight: 500; line-height: 1.45">如何评价近年国产独立游戏的叙事尝试？</div>
      <div style="font-size: 12px; font-weight: 300; color: #63666C">知乎回答 · [回答者] · www.zhihu.com</div>
    </div>

    <div style="padding: 6px 16px; border-radius: 16px; background: #FFFFFF">
      <sc-for list="{{steps}}" as="s" hint-placeholder-count="6">
        <div style="min-height: 50px; display: flex; align-items: center; gap: 12px; {{s.border}}">
          <sc-if value="{{s.done}}" hint-placeholder-val="{{true}}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1E6B45" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-label="已完成"><circle cx="12" cy="12" r="8.5"></circle><path d="M8.5 12.2l2.4 2.3 4.6-4.8"></path></svg></sc-if>
          <sc-if value="{{s.active}}" hint-placeholder-val="{{false}}"><span aria-label="进行中" style="width: 18px; height: 18px; border-radius: 9px; border: 2px solid #D6DCEA; border-top-color: #1F5FCC; box-sizing: border-box; flex: none"></span></sc-if>
          <sc-if value="{{s.todo}}" hint-placeholder-val="{{false}}"><span aria-label="等待" style="width: 18px; height: 18px; border-radius: 9px; border: 1.5px solid #C6C7CB; box-sizing: border-box; flex: none"></span></sc-if>
          <span style="flex: 1; font-size: 15px; {{s.labelStyle}}">{{s.label}}</span>
          <span style="font-size: 12px; font-weight: 300; color: #63666C">{{s.note}}</span>
        </div>
      </sc-for>
      <div style="margin: 0 0 12px 30px; height: 3px; border-radius: 2px; background: #E1E7F3; overflow: hidden"><div style="width: 50%; height: 100%; background: #1F5FCC"></div></div>
    </div>

    <div style="padding: 0 4px; font-size: 12px; font-weight: 300; line-height: 1.7; color: #63666C">可以离开此页，任务会在后台继续。断网时会暂停，联网后自动恢复。</div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
    <button type="button" style="width: 100%; height: 48px; border-radius: 24px; border: 0.5px solid #D9D9D4; background: #FFFFFF; color: #C23B2E; font: inherit; font-size: 15px; font-weight: 400">取消保存</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['加入队列', '21:14', 'done'], ['获取网页', '1.2 秒', 'done'], ['提取正文', '知乎回答规则', 'done'],
      ['检查完整性', '完整正文', 'done'], ['下载正文图片', '6 / 12', 'active'], ['保存快照', '', 'todo']
    ];
    const steps = raw.map((r, i) => ({
      label: r[0], note: r[1], done: r[2] === 'done', active: r[2] === 'active', todo: r[2] === 'todo',
      labelStyle: r[2] === 'active' ? 'font-weight: 500; color: #1F5FCC;' : r[2] === 'todo' ? 'font-weight: 400; color: #63666C;' : 'font-weight: 400; color: #1A1B1E;',
      border: i < raw.length - 1 && r[2] !== 'active' ? 'border-bottom: 0.5px solid #ECECE8;' : ''
    }));
    return { steps };
  }
}
</script>
</body>
</html>
