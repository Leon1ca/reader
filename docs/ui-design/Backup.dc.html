<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>备份与恢复</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">

  <div style="height: 84px; padding: 28px 8px 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px">
    <a href="Settings.dc.html" aria-label="返回设置" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1B1E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 500">备份与恢复</span>
  </div>

  <div style="padding: 4px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 300; color: #63666C; padding: 0 4px">导出备份</span>

    <label style="padding: 14px 16px; border-radius: 16px; background: #FFFFFF; box-shadow: inset 0 0 0 1.5px #1F5FCC; display: flex; gap: 12px">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 6px solid #1F5FCC; box-sizing: border-box; flex: none; margin-top: 1px"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 500">完整备份</span><span style="font-size: 13px; font-weight: 300; color: #63666C">约 2.8 GB</span></span>
        <span style="font-size: 12px; font-weight: 300; line-height: 1.6; color: #63666C">图书副本、主动保存的文章与图片、订阅、分类、进度、书签和设置</span>
      </span>
    </label>
    <label style="padding: 14px 16px; border-radius: 16px; background: #FFFFFF; display: flex; gap: 12px">
      <span style="width: 22px; height: 22px; border-radius: 11px; border: 1.5px solid #C6C7CB; box-sizing: border-box; flex: none; margin-top: 1px"></span>
      <span style="flex: 1; display: flex; flex-direction: column; gap: 4px">
        <span style="display: flex; justify-content: space-between"><span style="font-size: 15px; font-weight: 500">仅配置与记录</span><span style="font-size: 13px; font-weight: 300; color: #63666C">约 3 MB</span></span>
        <span style="font-size: 12px; font-weight: 300; line-height: 1.6; color: #63666C">订阅、分类、进度、书签和设置；不含图书和文章正文，恢复后需重新关联文件</span>
      </span>
    </label>

    <div style="padding: 12px 14px; border-radius: 14px; background: #FBF1E4; display: flex; gap: 8px; font-size: 12px; font-weight: 300; line-height: 1.6; color: #8A4600">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" style="flex: none; margin-top: 2px"><path d="M12 4l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg>
      <span>备份文件未加密，可能包含你的私人阅读内容，请妥善保存。网站登录会话不会被导出。</span>
    </div>

    <button type="button" style="height: 48px; border-radius: 24px; border: none; background: #1F5FCC; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400">选择位置并导出</button>
  </div>

  <div style="padding: 24px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <span style="font-size: 12px; font-weight: 300; color: #63666C; padding: 0 4px">恢复</span>
    <a href="RestorePreview.dc.html" style="height: 52px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between; text-decoration: none; color: #1A1B1E"><span style="font-size: 15px; font-weight: 400">从备份文件恢复</span><span style="font-size: 14px; font-weight: 300; color: #63666C">›</span></a>
    <p style="margin: 0; padding: 0 4px; font-size: 12px; font-weight: 300; line-height: 1.7; color: #63666C">卸载应用前请先导出备份，应用内数据会随卸载一并删除。</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
