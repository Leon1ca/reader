<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>阅读器 · 设置面板</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;family=Noto+Serif+SC:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background-color: #F3ECDF; background-image: radial-gradient(120% 90% at 50% 40%, rgba(255,255,255,0.28), rgba(255,255,255,0) 60%), radial-gradient(140% 120% at 50% 50%, rgba(0,0,0,0) 60%, rgba(90,70,40,0.06)); font-family: 'Noto Sans SC', sans-serif; color: #2B2620">

  <div style="position: absolute; top: 0; left: 0; right: 0; height: 76px; padding: 26px 64px 0; box-sizing: border-box; display: flex; align-items: center; justify-content: center">
    <span style="font-size: 13px; font-weight: 400; letter-spacing: 1px; color: #5A5040">本章剩余 4 页</span>
  </div>
  <a href="Main.dc.html" aria-label="关闭本书" style="position: absolute; top: 29px; right: 14px; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; text-decoration: none">
    <span style="width: 30px; height: 30px; border-radius: 15px; background: rgba(90,80,64,0.1); display: flex; align-items: center; justify-content: center; color: #4A4236"><svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M2 2l8 8M10 2L2 10"></path></svg></span>
  </a>

  <div style="position: absolute; top: 76px; left: 26px; right: 26px; font-family: 'Noto Serif SC', serif">
    <p style="margin: 0 0 10px; text-indent: 2em; font-size: 18px; line-height: 1.75; text-align: justify">我冒了严寒，回到相隔二千余里，别了二十余年的故乡去。</p>
    <p style="margin: 0 0 10px; text-indent: 2em; font-size: 18px; line-height: 1.75; text-align: justify">时候既然是深冬；渐近故乡时，天气又阴晦了，冷风吹进船舱中，呜呜的响，从篷隙向外一望，苍黄的天底下，远近横着几个萧索的荒村，没有一些活气。我的心禁不住悲凉起来了。</p>
  </div>

  <section aria-label="排版设置" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 30px; border-radius: 24px 24px 0 0; background: #FBF8F2; box-shadow: 0 -8px 30px rgba(43,38,32,0.12); display: flex; flex-direction: column; gap: 14px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #DDD4C4; align-self: center; margin-bottom: 4px"></div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">字号</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
        <button type="button" aria-label="减小字号" style="border: none; border-radius: 9px; background: transparent; font-family: 'Noto Serif SC', serif; font-size: 13px; color: #3B342A">A</button>
        <span style="display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 500; color: #2B2620; font-variant-numeric: tabular-nums">18</span>
        <button type="button" aria-label="增大字号" style="border: none; border-radius: 9px; background: transparent; font-family: 'Noto Serif SC', serif; font-size: 19px; color: #3B342A">A</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">字体</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 3px">
        <button type="button" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); font-family: 'Noto Serif SC', serif; font-size: 13px; font-weight: 500; color: #1F5FCC">宋体</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 400; color: #3B342A">黑体</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font-family: 'Noto Serif SC', serif; font-size: 13px; font-weight: 400; color: #3B342A">楷体</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 400; color: #3B342A">更多 ›</button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">行距</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
        <button type="button" aria-label="紧凑" style="border: none; border-radius: 9px; background: transparent; color: #3B342A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 6h14M3 9h14M3 12h14M3 15h9"></path></svg></button>
        <button type="button" aria-label="标准" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); color: #1F5FCC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4.5h14M3 8.5h14M3 12.5h14M3 16.5h9"></path></svg></button>
        <button type="button" aria-label="宽松" style="border: none; border-radius: 9px; background: transparent; color: #3B342A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 3h14M3 8h14M3 13h14M3 18h9"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">边距</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px">
        <button type="button" aria-label="窄边距" style="border: none; border-radius: 9px; background: transparent; color: #3B342A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2.5" y="3" width="15" height="14" rx="2"></rect><path d="M5 7h10M5 10h10M5 13h10"></path></svg></button>
        <button type="button" aria-label="标准边距" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); color: #1F5FCC; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2.5" y="3" width="15" height="14" rx="2"></rect><path d="M6.5 7h7M6.5 10h7M6.5 13h7"></path></svg></button>
        <button type="button" aria-label="宽边距" style="border: none; border-radius: 9px; background: transparent; color: #3B342A; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><rect x="2.5" y="3" width="15" height="14" rx="2"></rect><path d="M8 7h4M8 10h4M8 13h4"></path></svg></button>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 44px; flex: none; font-size: 13px; font-weight: 400; color: #6B604F">样式</span>
      <div style="flex: 1; height: 40px; box-sizing: border-box; padding: 3px; border-radius: 12px; background: #F0EADF; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px">
        <button type="button" style="border: none; border-radius: 9px; background: #FFFFFF; box-shadow: 0 1px 2px rgba(43,38,32,0.12); font: inherit; font-size: 13px; font-weight: 500; color: #1F5FCC">保留原书样式</button>
        <button type="button" style="border: none; border-radius: 9px; background: transparent; font: inherit; font-size: 13px; font-weight: 400; color: #3B342A">自定义阅读样式</button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 300; color: #6B604F; padding-top: 2px">
      <span>以上设置对所有图书生效</span>
    </div>
  </section>
</div>
</x-dc>
