<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>存储空间</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">

  <div style="height: 84px; padding: 28px 8px 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px">
    <a href="Settings.dc.html" aria-label="返回设置" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1B1E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 500">存储空间</span>
  </div>

  <div style="margin: 4px 20px 0; padding: 18px 16px; border-radius: 16px; background: #FFFFFF; display: flex; flex-direction: column; gap: 14px">
    <div style="display: flex; align-items: baseline; gap: 6px"><span style="font-size: 28px; font-weight: 500; letter-spacing: 0.5px">3.2 GB</span><span style="font-size: 13px; font-weight: 300; color: #63666C">已使用 · 设备剩余 41 GB</span></div>
    <div style="height: 10px; border-radius: 5px; overflow: hidden; display: flex; gap: 2px; background: #ECECE8">
      <div style="width: 65%; background: #1F5FCC"></div>
      <div style="width: 20%; background: #6E9BEA"></div>
      <div style="width: 12%; background: #E2A33B"></div>
      <div style="width: 3%; background: #B9BBC0"></div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; font-size: 14px">
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #1F5FCC"></span><span style="flex: 1; font-weight: 400">图书</span><span style="font-weight: 300; color: #63666C">2.1 GB</span></div>
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #6E9BEA"></span><span style="flex: 1; font-weight: 400">保存的文章与图片</span><span style="font-weight: 300; color: #63666C">640 MB</span></div>
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #E2A33B"></span><span style="flex: 1; font-weight: 400">RSS 缓存 <span style="font-size: 12px; font-weight: 300; color: #63666C">· 可清理</span></span><span style="font-weight: 300; color: #63666C">380 MB</span></div>
      <div style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #B9BBC0"></span><span style="flex: 1; font-weight: 400">缩略图与索引 <span style="font-size: 12px; font-weight: 300; color: #63666C">· 可清理</span></span><span style="font-weight: 300; color: #63666C">90 MB</span></div>
    </div>
  </div>

  <div style="margin: 12px 20px 0; border-radius: 16px; background: #FFFFFF">
    <div style="height: 50px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 0.5px solid #ECECE8"><span style="font-size: 15px; font-weight: 400">RSS 缓存上限</span><span style="font-size: 14px; font-weight: 300; color: #63666C">1 GB ›</span></div>
    <div style="height: 50px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between"><span style="font-size: 15px; font-weight: 400">自动清理已读缓存</span><span style="font-size: 14px; font-weight: 300; color: #63666C">超过 30 天 ›</span></div>
  </div>

  <div style="margin: 20px 20px 0; display: flex; flex-direction: column; gap: 10px">
    <button type="button" style="height: 48px; border-radius: 24px; border: none; background: #1F5FCC; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 400">清理可重建缓存 · 470 MB</button>
    <p style="margin: 0; padding: 0 8px; font-size: 12px; font-weight: 300; line-height: 1.7; color: #63666C; text-align: center">导入的图书、主动保存或收藏的文章、阅读进度和书签不会被清理。</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
