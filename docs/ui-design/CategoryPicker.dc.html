<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>加入分类</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">
  <div style="position: absolute; inset: 0; background: rgba(20,22,26,0.28)"></div>

  <section aria-label="加入分类" style="position: absolute; left: 0; right: 0; bottom: 0; padding: 10px 20px 30px; border-radius: 24px 24px 0 0; background: #F7F7F5; display: flex; flex-direction: column; gap: 14px">
    <div style="width: 36px; height: 4px; border-radius: 2px; background: #D6D6D1; align-self: center"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <a href="ShelfSelect.dc.html" style="font-size: 15px; font-weight: 400; color: #63666C; text-decoration: none; height: 44px; display: flex; align-items: center">取消</a>
      <h2 style="margin: 0; font-size: 16px; font-weight: 500">加入分类 · 3 本</h2>
      <a href="ShelfSelect.dc.html" style="font-size: 15px; font-weight: 500; color: #1F5FCC; text-decoration: none; height: 44px; display: flex; align-items: center">完成</a>
    </div>

    <div style="border-radius: 16px; background: #FFFFFF; padding: 0 16px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
        <label style="height: 50px; display: flex; align-items: center; gap: 12px; {{c.border}}">
          <sc-if value="{{c.all}}" hint-placeholder-val="{{true}}"><span aria-label="已选" style="width: 22px; height: 22px; border-radius: 6px; background: #1F5FCC; display: flex; align-items: center; justify-content: center; flex: none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></span></sc-if>
          <sc-if value="{{c.some}}" hint-placeholder-val="{{false}}"><span aria-label="部分已选" style="width: 22px; height: 22px; border-radius: 6px; background: #1F5FCC; display: flex; align-items: center; justify-content: center; flex: none"><span style="width: 10px; height: 2px; border-radius: 1px; background: #FFFFFF"></span></span></sc-if>
          <sc-if value="{{c.none}}" hint-placeholder-val="{{false}}"><span aria-label="未选" style="width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid #C6C7CB; box-sizing: border-box; flex: none"></span></sc-if>
          <span style="flex: 1; font-size: 15px; font-weight: 400">{{c.name}}</span>
          <span style="font-size: 12px; font-weight: 300; color: #63666C">{{c.note}}</span>
        </label>
      </sc-for>
    </div>

    <div style="display: flex; justify-content: space-between">
      <button type="button" style="height: 44px; border: none; background: transparent; color: #1F5FCC; font: inherit; font-size: 15px; font-weight: 400; padding: 0">+ 新建分类</button>
      <a href="CategoryManage.dc.html" style="height: 44px; color: #63666C; font-size: 14px; font-weight: 400; text-decoration: none; display: flex; align-items: center">管理分类 ›</a>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [['小说', 'all', '3 本均在此分类'], ['古典', 'some', '其中 2 本'], ['现代文学', 'none', ''], ['漫画', 'none', '']];
    const cats = raw.map((r, i) => ({ name: r[0], note: r[2], all: r[1] === 'all', some: r[1] === 'some', none: r[1] === 'none', border: i < raw.length - 1 ? 'border-bottom: 0.5px solid #ECECE8;' : '' }));
    return { cats };
  }
}
</script>
</body>
</html>
