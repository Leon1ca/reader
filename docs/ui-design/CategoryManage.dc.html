<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>管理分类</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500&amp;display=swap">
<style>
body{margin:0;-webkit-font-smoothing:antialiased}
a{color:#1F5FCC}a:hover{color:#174A9F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F7F7F5; font-family: 'Noto Sans SC', sans-serif; color: #1A1B1E">

  <div style="height: 84px; padding: 28px 8px 0; box-sizing: border-box; display: flex; align-items: center; gap: 4px">
    <a href="CategoryPicker.dc.html" aria-label="返回" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #1A1B1E"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <span style="font-size: 16px; font-weight: 500">管理分类</span>
  </div>

  <div style="margin: 4px 20px 0; border-radius: 16px; background: #FFFFFF; padding: 0 16px">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <div style="height: 50px; display: flex; align-items: center; gap: 12px; {{c.border}}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9A9CA1" stroke-width="1.6" stroke-linecap="round" aria-label="拖动排序"><path d="M5 9h14M5 15h14"></path></svg>
        <span style="flex: 1; font-size: 15px; font-weight: 400">{{c.name}}</span>
        <span style="font-size: 13px; font-weight: 300; color: #63666C">{{c.count}}</span>
        <button type="button" aria-label="重命名或删除" style="width: 36px; height: 36px; border: none; background: transparent; color: #63666C; display: flex; align-items: center; justify-content: center; padding: 0"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><circle cx="5.75" cy="12" r="1.5"></circle><circle cx="12" cy="12" r="1.5"></circle><circle cx="18.25" cy="12" r="1.5"></circle></svg></button>
      </div>
    </sc-for>
  </div>

  <div style="margin: 12px 20px 0; height: 50px; padding: 0 16px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 15px; font-weight: 400; color: #63666C">未分类</span>
    <span style="font-size: 12px; font-weight: 300; color: #63666C">系统视图 · 5 本</span>
  </div>

  <button type="button" style="margin: 12px 20px 0; width: 350px; height: 50px; border-radius: 16px; border: none; background: #FFFFFF; color: #1F5FCC; font: inherit; font-size: 15px; font-weight: 400">+ 新建分类</button>

  <p style="margin: 12px 24px 0; font-size: 12px; font-weight: 300; line-height: 1.7; color: #63666C">一本书可以属于多个分类。删除分类不会删除其中的图书。</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [['小说', '6 本'], ['古典', '5 本'], ['现代文学', '3 本'], ['漫画', '2 本']];
    const cats = raw.map((r, i) => ({ name: r[0], count: r[1], border: i < raw.length - 1 ? 'border-bottom: 0.5px solid #ECECE8;' : '' }));
    return { cats };
  }
}
</script>
</body>
</html>
